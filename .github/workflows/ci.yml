# Self-contained CI for this repository.
#
# Earlier drafts called reusable workflows in poli0981/.github. Three of the four did not exist under the
# names used, the one that did takes a different input set, and its C# CodeQL job runs on ubuntu, which
# cannot build the net10.0-windows projects. Owning the pipeline here keeps the gates in docs/18_CI_CD.md
# enforceable instead of aspirational. Action versions match the ones the ops repo has verified.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build and test (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # packages.lock.json is committed, so a drifted pin fails here rather than resolving silently.
      - name: Restore (locked mode)
        run: dotnet restore AppLedger.slnx --locked-mode

      - name: Format check
        run: dotnet format AppLedger.slnx --verify-no-changes

      # Warnings are errors through Directory.Build.props; no extra flag needed.
      - name: Build
        run: dotnet build AppLedger.slnx -c Release --no-restore

      # Admin tests need real ETW sessions on an elevated box; Manual tests are the release checklist.
      - name: Test
        run: >
          dotnet test AppLedger.slnx -c Release --no-build
          --filter "Category!=Admin&Category!=Manual"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Coverage gate (AppLedger.Core at least 80 percent)
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
          if (-not $reports) { Write-Error 'No coverage report was produced.'; exit 1 }
          $rate = $null
          foreach ($report in $reports) {
            [xml]$xml = Get-Content $report.FullName
            foreach ($pkg in $xml.coverage.packages.package) {
              if ($pkg.name -eq 'AppLedger.Core') {
                $value = [double]$pkg.'line-rate' * 100
                if ($null -eq $rate -or $value -gt $rate) { $rate = $value }
              }
            }
          }
          if ($null -eq $rate) { Write-Error 'AppLedger.Core is absent from the coverage report.'; exit 1 }
          Write-Host ('AppLedger.Core line coverage: {0:N1} percent' -f $rate)
          if ($rate -lt 80) {
            Write-Error ('Coverage {0:N1} percent is below the 80 percent gate (docs/18_CI_CD.md).' -f $rate)
            exit 1
          }

      # `dotnet list package --vulnerable` exits 0 even when it finds something; vulnerable rows start with '>'.
      - name: Vulnerability gate
        shell: pwsh
        run: |
          $out = dotnet list AppLedger.slnx package --vulnerable --include-transitive | Out-String
          Write-Host $out
          if ($out -match '(?m)^\s*>\s') {
            Write-Error 'Vulnerable packages found (docs/18_CI_CD.md).'
            exit 1
          }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ARM64 is a supported target (NFR-6) and its own Velopack channel, so it must not rot between releases.
  # Build only: an x64 runner cannot execute ARM64 test binaries.
  build-arm64:
    name: Build (ARM64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The platform belongs on the restore as well, not only on the build. The win-arm64 apphost pack is
      # acquired during restore, so a restore that ran for x64 leaves the ARM64 build with no apphost.exe to
      # copy and it fails with MSB3030. It only started failing when the SDK moved far enough forward to pick
      # the apphost by PlatformTarget. Lock files are unaffected: apphost packs arrive as PackageDownload and
      # no packages.lock.json in the repo names a Host.win* entry, which is also why x64 was always fine.
      - name: Restore (locked mode)
        run: dotnet restore AppLedger.slnx --locked-mode -p:Platform=ARM64

      - name: Build
        run: dotnet build AppLedger.slnx -c Release -p:Platform=ARM64 --no-restore

  # SonarCloud. The project started on Automatic Analysis, which cannot import coverage and reads sources
  # without a compilation; the MSBuild scanner wraps a real build instead, so the C# analyzer sees what the
  # compiler saw. It builds and tests in its own job on purpose - `begin` writes the .sonarqube directory and
  # the targets file the build has to pick up, so the work cannot be borrowed from build-test. Deliberately
  # NOT a required status check: an outage at Sonar must not be able to block a merge.
  sonar:
    name: SonarCloud
    runs-on: windows-latest
    timeout-minutes: 30

    # Dependabot and fork pull requests are not given secrets, so the scan would fail on every one of them
    # for a reason that is not a defect. The check is absent on those PRs by design (docs/18_CI_CD.md).
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Sonar decides what counts as new code from git blame, and a shallow clone carries none.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The scanner is a .NET tool that shells out to a JRE, so one has to be on the runner.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the scanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.0.0

      - name: Restore (locked mode)
        run: dotnet restore AppLedger.slnx --locked-mode

      # One step, because the three commands are one transaction: `begin` prepares the build hooks, the build
      # and test runs produce the analysis and the reports, and `end` uploads what they produced. Coverage is
      # OpenCover here because that is the format Sonar's C# plugin reads; build-test keeps collecting
      # Cobertura for the 80 % gate, so the two never fight over one file.
      - name: Analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # The token is left in the environment rather than passed as /d:sonar.token=, which the scanner
          # reads by itself. Nothing secret then appears in the command line this step echoes into the log.
          # spikes/** is excluded belt-and-braces: it is outside AppLedger.slnx so the MSBuild scanner never
          # compiles it, but the file-level scan would still index it as unanalysable C#. tools/** is
          # excluded for the same reason it exists - developer scripts, never shipped, never fed anything
          # but a path the developer typed. The file-level scan flagged s1-report.py for connection-string
          # injection and path traversal "via faulty LLM-supplied CLI arguments", a premise that does not
          # hold for a reporting tool run by hand. This is a scope decision, not a severity one.
          #
          # sonar.coverage.exclusions names the files whose real coverage comes from Category=Admin tests
          # that CI is documented to skip: the Agent CLI entry point, the schtasks wrapper, the ETW hub, and
          # WPF code-behind that CLAUDE.md allows no logic in. Without them Sonar's default gate applies an
          # 80 % new-code coverage rule to code that cannot be covered without elevation, and contradicts
          # docs/18, where the 80 % gate is deliberately AppLedger.Core alone - "the part that decides what
          # every number means, and it runs anywhere without privileges". Coverage only: these files are
          # still analysed, and their issues are still reported.
          dotnet sonarscanner begin `
            /k:"poli0981_appledger" `
            /o:"poli0981" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.exclusions="src/AppLedger.App/Resources/Strings.cs,spikes/**,tools/**" `
            /d:sonar.coverage.exclusions="src/AppLedger.Agent/Program.cs,src/AppLedger.Agent/Tasks/SchTasks.cs,src/AppLedger.Infrastructure/Etw/EtwHub.cs,src/AppLedger.App/**/*.xaml.cs,src/AppLedger.App/App.xaml.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # TreatWarningsAsErrors is off for this build alone. `begin` injects SonarAnalyzer into the
          # compilation, and Directory.Build.props turns every warning into an error - so Sonar's own rule
          # set would decide whether the build survives long enough for `end` to upload anything, and a new
          # Sonar rule would read as a compile failure. build-test is the job that enforces
          # warnings-as-errors; this one reports, and must not be able to fail for having found something.
          dotnet build AppLedger.slnx -c Release --no-restore --no-incremental `
            -p:TreatWarningsAsErrors=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test AppLedger.slnx -c Release --no-build `
            --filter "Category!=Admin&Category!=Manual" `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage;Format=opencover"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet sonarscanner end
