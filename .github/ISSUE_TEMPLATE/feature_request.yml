name: Feature request
description: Propose a metric, data source, or UI improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you see or do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "For new metrics: which Windows API / ETW provider supplies it, and does it need admin? (docs/04_DATA_SOURCES.md)"
    validations:
      required: true
  - type: checkboxes
    id: nongoals
    attributes:
      label: Scope check
      options:
        - label: I read docs/23_NON_GOALS.md and this is not a blocked feature (firewall, kill/uninstall, telemetry, kernel driver, payload capture).
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
